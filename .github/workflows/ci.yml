name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: windows (d3d11, full)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build (Release)
        run: dotnet build -c Release
      - name: Test (full suite, 456)
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"
      - name: Native AOT publish (win-x64)
        run: dotnet publish examples/Counter/Counter.csproj -c Release -r win-x64 -p:PublishAot=true
      - name: AOT smoke (5s clean exit)
        run: |
          $p = Start-Process "examples/Counter/bin/Release/net10.0/win-x64/publish/Counter.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "AOT smoke: exited early with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "AOT smoke OK (alive 5s)"
      - name: Record deployable size
        run: |
          $d = "examples/Counter/bin/Release/net10.0/win-x64/publish"
          $bytes = (Get-ChildItem $d -File | Where-Object { $_.Extension -ne ".pdb" } | Measure-Object -Sum Length).Sum
          Write-Host ("deployable (no pdb): {0} B = {1:N2} MiB" -f $bytes, ($bytes/1MB))
        shell: powershell

  linux:
    name: linux (gl, native glue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install native deps (libsdl2 + freetype + harfbuzz)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libfreetype6 libharfbuzz0b fonts-noto-cjk xvfb
      - name: Build (Release)
        run: dotnet build -c Release
      - name: Non-GPU logic tests (pure + native glue)
        run: dotnet test -c Release --no-build --filter "FullyQualifiedName!~Gpu" --logger "console;verbosity=normal"
      - name: Native library resolution probe (headless, no App entry)
        run: |
          cat > /tmp/probe.csx << 'EOF'
          // resolver probe: FT/HB load through NativeLib resolver without App
          EOF
          dotnet test -c Release --no-build --filter "FullyQualifiedName~NativeLibTests|FullyQualifiedName~FontLocatorTests&FullyQualifiedName!~Windows" || true
      - name: GPU tests under xvfb (GL software)
        run: |
          xvfb-run -a dotnet test -c Release --no-build --filter "Category=Gpu" --logger "console;verbosity=normal"
        continue-on-error: true # 首跑 GL 环境摸底:软渲染器 SwapChain 兼容性未知,失败不阻断(待实机调参)

  macos:
    name: macos (metal, gated)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install native deps (sdl2 + freetype + harfbuzz via brew)
        run: |
          brew install sdl2 freetype harfbuzz
      - name: Build (Release)
        run: dotnet build -c Release
      - name: Non-GPU logic tests
        run: dotnet test -c Release --no-build --filter "FullyQualifiedName!~Gpu" --logger "console;verbosity=normal"
      - name: Metal gated tests (ruling-48 checklist 1-8)
        run: |
          export SHARPUI_RUN_MAC=1
          dotnet test -c Release --no-build --filter "FullyQualifiedName~MetalContextTests|FullyQualifiedName~ObjectiveCTests" --logger "console;verbosity=detailed"
      - name: FontLibrary real-machine discovery (checklist 6)
        run: |
          dotnet test -c Release --no-build --filter "FullyQualifiedName~FontLocatorTests" --logger "console;verbosity=normal"
        continue-on-error: true # 目录扫描回退路径在 macos 的实机摸底,失败不阻断首次
